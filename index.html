<script>
  // Configuration Tailwind : polices coquettes + palette rose
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          cute: ['Fredoka', 'sans-serif'],

<style>
  /* ============================================================
     BASE & THÈMES PAR ONGLET (ambiance de rose unique)
     ============================================================ */
  :root{
    --rose-bonbon:#FF7EB9;
    --rose-fonce:#E84E8A;
    --fuchsia:#FF3E9A;
    --rose-gold:#E7A9A0;
    --creme:#FFF5F8;
    --shadow-rose:rgba(255,126,185,.35);
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ overscroll-behavior-y: none; }
  /* Pas d'overflow-x sur html/body : ça cassait le défilement molette.
     Les éléments animés (confettis, décor) sont bornés pour ne pas déborder. */
  body{
    font-family:'Quicksand',sans-serif;
    background:var(--creme);
    color:#5a3d4d;
    padding-bottom: env(safe-area-inset-bottom);
    transition: background .5s ease;
  }
  h1,h2,h3,.font-cute{ font-family:'Fredoka',sans-serif; }

  /* --- Ambiances de fond par onglet --- */
  body[data-theme="studio"]  { background: linear-gradient(160deg,#FFF5F8 0%, #FFE9F2 100%); }
  body[data-theme="stock"]   { background: linear-gradient(160deg,#FFF0F7 0%, #FCE1FF 100%); }
  body[data-theme="scan"]    { background: linear-gradient(160deg,#FFEFFA 0%, #EAF3FF 100%); }
  body[data-theme="carnet"]  { background: linear-gradient(160deg,#FFF3EF 0%, #FFE7EE 100%); }
  body[data-theme="tuto"]    { background: linear-gradient(160deg,#FFEDF6 0%, #FFDDEF 100%); }
  body[data-theme="plans"]   { background: linear-gradient(160deg,#FFF4F0 0%, #F9E6D9 100%); }

  /* Couleur d'accent qui change selon l'onglet */
  body[data-theme="studio"]  { --accent:#FF7EB9; --accent-d:#E84E8A; }
  body[data-theme="stock"]   { --accent:#FF3E9A; --accent-d:#D62580; }
  body[data-theme="scan"]    { --accent:#FF6FD8; --accent-d:#C94FE0; }
  body[data-theme="carnet"]  { --accent:#F7A399; --accent-d:#E27C6E; }
  body[data-theme="tuto"]    { --accent:#FF5FA2; --accent-d:#E43E85; }
  body[data-theme="plans"]   { --accent:#E0A46A; --accent-d:#C67C3E; }

  /* ============================================================
     COMPOSANTS MIGNONS
     ============================================================ */
  .card{
    background:rgba(255,255,255,.75);
    backdrop-filter: blur(8px);
    border:2px solid rgba(255,255,255,.9);
    border-radius:1.75rem;
    box-shadow:0 8px 24px var(--shadow-rose);
  }
  .card-heart-border{
    border:2px solid var(--accent);
    box-shadow:0 6px 18px var(--shadow-rose);
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:#fff; border-radius:9999px; font-weight:600;
    box-shadow:0 6px 16px var(--shadow-rose);
    transition:transform .12s ease, box-shadow .2s ease;
  }
  .btn-primary:active{ transform:scale(.94); }
  .btn-soft{
    background:#fff; color:var(--accent-d);
    border:2px solid var(--accent); border-radius:9999px; font-weight:600;
    transition:transform .12s ease;
  }
  .btn-soft:active{ transform:scale(.94); }
  .chip{
    border-radius:9999px; padding:.4rem .85rem; font-weight:600; font-size:.8rem;
    border:2px solid transparent; cursor:pointer; transition:all .15s ease;
    background:#fff; color:#a06;
  }
  .chip.active{ background:var(--accent); color:#fff; border-color:var(--accent-d); box-shadow:0 4px 10px var(--shadow-rose); }
  .badge-pastel{
    background:linear-gradient(135deg,#FFE3F1,#FFD1E8);
    color:#c23; border-radius:9999px; padding:.15rem .6rem; font-size:.7rem; font-weight:700;
  }
  input,select,textarea{
    font-family:'Quicksand',sans-serif; font-size:15px; font-weight:500;
    background:#fff; border:1.5px solid #F1C4D9; border-radius:.75rem;
    padding:.72rem .95rem; width:100%; color:#5a3d4d; outline:none;
    box-shadow: inset 0 1px 2px rgba(200,120,160,.07);
    transition:border-color .18s, box-shadow .18s;
  }
  input::placeholder,textarea::placeholder{ color:#c69bb2; }
  input:focus,select:focus,textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--shadow-rose); }
  textarea{ resize:vertical; min-height:3rem; }
  label{ font-size:.8rem; font-weight:700; color:#a4708a; margin-bottom:.35rem; display:block; letter-spacing:.2px; }

  /* Nav du bas */
  .nav-btn{ transition:transform .15s ease, color .2s ease; color:#c799b0; }
  .nav-btn.active{ color:var(--accent-d); transform:translateY(-4px) scale(1.12); }
  .nav-btn.active .nav-dot{ opacity:1; transform:scale(1); }
  .nav-dot{ opacity:0; transform:scale(0); transition:all .2s; }

  /* Étincelles décoratives */
  .sparkle{ position:absolute; pointer-events:none; animation: twinkle 2.5s infinite ease-in-out; }
  @keyframes twinkle{ 0%,100%{opacity:.3; transform:scale(.8) rotate(0);} 50%{opacity:1; transform:scale(1.15) rotate(20deg);} }

  /* Cœur qui bat (chrono) */
  @keyframes heartbeat{ 0%,100%{transform:scale(1);} 25%{transform:scale(1.18);} 40%{transform:scale(1);} 60%{transform:scale(1.12);} }
  .heartbeat{ animation:heartbeat 1s infinite; }

  /* Effet holographique (onglet scan) */
  .holo{
    background:linear-gradient(115deg,#ffd6f5,#d6f0ff,#e8d6ff,#ffe0f0,#d6fff0);
    background-size:300% 300%;
    animation:holoShift 6s ease infinite;
  }
  @keyframes holoShift{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

  /* Polaroid (carnet) */
  .polaroid{
    background:#fff; padding:.6rem .6rem 2.2rem; border-radius:.4rem;
    box-shadow:0 8px 20px rgba(0,0,0,.12); transform:rotate(-2deg);
    transition:transform .2s;
  }
  .polaroid:nth-child(even){ transform:rotate(1.5deg); }
  .polaroid:active{ transform:rotate(0) scale(1.02); }

  /* Roulette étoiles */
  @keyframes starRain{ 0%{transform:translateY(-20px) rotate(0); opacity:1;} 100%{transform:translateY(120vh) rotate(360deg); opacity:0;} }
  .star-drop{ position:fixed; top:-30px; z-index:80; pointer-events:none; animation:starRain linear forwards; }

  /* Apparition douce des vues */
  .view-enter{ animation:fadeUp .35s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

  /* Toast */
  #toast{ transition:opacity .3s, transform .3s; }

  /* Ongle SVG : dégradé de brillance appliqué par-dessus la couleur */
  .nail-gloss{ mix-blend-mode:screen; }

  /* Scroll horizontal sans barre */
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  /* Petite pastille cœur brisé (péremption) */
  .pulse-alert{ animation:pulseAlert 1.4s infinite; }
  @keyframes pulseAlert{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  /* ============================================================
     RAFFINEMENTS DESIGN
     ============================================================ */
  /* Couche décorative flottante en fond (nœuds, cœurs, étincelles) */
  #deco{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  #deco span{ position:absolute; opacity:.12; will-change:transform; animation:floaty 11s ease-in-out infinite; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(-6deg); } 50%{ transform:translateY(-22px) rotate(10deg); } }
  #app{ position:relative; z-index:1; }               /* le contenu passe au-dessus du décor */

  /* Cartes & boutons : reflet subtil sans gêner le texte */
  .card{ box-shadow:0 10px 26px var(--shadow-rose), inset 0 1px 0 rgba(255,255,255,.85); }
  .btn-primary{ box-shadow:0 6px 16px var(--shadow-rose), inset 0 1px 0 rgba(255,255,255,.32); }
  .btn-primary:active{ box-shadow:0 3px 10px var(--shadow-rose); }
  .chip{ box-shadow:0 2px 6px rgba(255,126,185,.10); }

  /* Nav : halo doux sous l'icône active + en-tête souligné finement */
  .nav-btn.active i{ filter: drop-shadow(0 3px 6px var(--shadow-rose)); }
  header{ border-bottom:1px solid rgba(255,126,185,.18); }

  /* Survol souris (ordinateur) — n'affecte pas le tactile */
  @media (hover:hover){
    .btn-primary:hover{ filter:brightness(1.06); }
    .btn-soft:hover{ background:var(--accent); color:#fff; }
    .chip:hover{ border-color:var(--accent); }
    .nav-btn:hover{ color:var(--accent-d); }
    .card:hover{ box-shadow:0 14px 32px var(--shadow-rose), inset 0 1px 0 rgba(255,255,255,.85); }
    .card-heart-border:hover{ transform:translateY(-2px); }
    .polaroid:hover{ transform:rotate(0) scale(1.03); }
    a[target]:hover{ transform:translateY(-2px); }
  }
  /* Barre de nav en mode « bureau » : libellés lisibles + disposition compacte */
  @media (min-width:768px){
    nav .nav-btn{ flex:0 0 auto; padding:6px 14px; border-radius:14px; }
    nav .nav-btn span:not(.nav-dot){ font-size:11px; }
    nav .nav-btn i{ width:20px; height:20px; }
    nav .nav-btn.active{ background:var(--shadow-rose); transform:translateY(0) scale(1.03); }
    nav .nav-dot{ display:none; }
  }

  /* ============================================================
     MODE SOMBRE (si le navigateur/système est en sombre) — thème rose nuit
     ============================================================ */
  @media (prefers-color-scheme: dark){
    :root{ --shadow-rose:rgba(255,90,160,.30); }
    body{ color:#f2d7e5; }
    body[data-theme="studio"] { background:linear-gradient(160deg,#1c0f18 0%,#2a1422 100%); }
    body[data-theme="stock"]  { background:linear-gradient(160deg,#1e0f1c 0%,#2c1230 100%); }
    body[data-theme="scan"]   { background:linear-gradient(160deg,#1b0f1e 0%,#181a2e 100%); }
    body[data-theme="carnet"] { background:linear-gradient(160deg,#221019 0%,#2a1320 100%); }
    body[data-theme="tuto"]   { background:linear-gradient(160deg,#210f1b 0%,#2c1226 100%); }
    body[data-theme="plans"]  { background:linear-gradient(160deg,#211410 0%,#2a1a18 100%); }
    .card{ background:rgba(48,26,40,.74); border-color:rgba(255,150,200,.14);
      box-shadow:0 10px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
    .card-heart-border{ background:rgba(48,26,40,.6); }
    input,select,textarea{ background:#28131f; color:#f9e9f0; border-color:#743a58; box-shadow: inset 0 1px 3px rgba(0,0,0,.3); }
    input::placeholder,textarea::placeholder{ color:#b487a1; }
    input:focus,select:focus,textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--shadow-rose); }
    label{ color:#e6acc8; }
    .chip{ background:#2c1826; color:#ffb3d6; }
    .btn-soft{ background:#2c1826; color:#ff9ecb; }
    .badge-pastel{ background:linear-gradient(135deg,#4a2236,#5a2942); color:#ffc2de; }
    header{ background:rgba(24,13,20,.72)!important; border-bottom-color:rgba(255,120,180,.16); }
    nav{ background:rgba(30,17,26,.9)!important; border-top-color:#42243a!important; }
    @media (min-width:768px){ nav{ border-color:#42243a!important; } }
    .polaroid{ background:#2c1826; }
    .text-gray-400{ color:#a888a0!important; }
    .text-gray-500{ color:#b89ab0!important; }
    #modal{ background:rgba(10,4,8,.6)!important; }
    #login-gate{ background:linear-gradient(160deg,#1c0f18,#2a1320)!important; }
    details > summary{ color:#ffb3d6; }
  }

  /* Respect des personnes qui réduisent les animations */
  @media (prefers-reduced-motion: reduce){
    #deco span, .heartbeat, .holo, .sparkle{ animation:none !important; }
  }
</style>
</head>

<script>
/* ================================================================
   💅 MON ATELIER NAIL ART — logique complète
   Données locales (LocalStorage, cache hors-ligne) + synchro privée Supabase.
   ================================================================ */

/* ---------- 1. PERSISTANCE ---------- */
const DB_KEY = 'nailStudio_v1';
const defaultDB = {
  gels: [],
  decors: [],
  tools: { ponceuse:false, lampeUV:false, lampeLED:false, pinceauLiner:false, aimantCatEye:false, pousseCuticules:false, dustBrush:false, limes:false },
  gelx: { L:{pouce:'',index:'',majeur:'',annulaire:'',auriculaire:''}, R:{pouce:'',index:'',majeur:'',annulaire:'',auriculaire:''} },
  inspirations: [],
  carnet: [],
  promos: [],
  pose: { technique:'Gainage', forme:'Amande', longueur:'Moyenne', style:'Clean Girl', finish:'glossy', mainNonDom:false, nails:['#FFDDE8','#FFDDE8','#FF7EB9','#FFDDE8','#FFDDE8'] },
  settings: { subsSeed:0 }
};
let DB = load();
function load(){
  try{ const raw = localStorage.getItem(DB_KEY); if(!raw) return structuredClone(defaultDB);
    return Object.assign(structuredClone(defaultDB), JSON.parse(raw));
  }catch(e){ return structuredClone(defaultDB); }
}
function save(fromSync){
  if(!fromSync) DB._localTs = Date.now();       // horodate la modif locale
  let ok = true;
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ ok = false; toast('⚠️ Mémoire pleine — retire ou réduis quelques photos 🥺'); }
  if(!fromSync && ok) scheduleCloudPush();       // puis on envoie au cloud (différé)
  return ok;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- Petits utilitaires sûrs ---------- */
// Échappe le texte réinjecté dans le HTML/attributs (marque, réf, titre, code…).
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Réduit une image (dataURL) avant stockage pour ne pas saturer le LocalStorage.
function downscaleImage(dataUrl, maxDim=1100, quality=0.72){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        try{
          let w = img.width, h = img.height;
          if(Math.max(w,h) > maxDim){ const r = maxDim/Math.max(w,h); w = Math.round(w*r); h = Math.round(h*r); }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg', quality));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = ()=>resolve(dataUrl);
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}

/* ---------- 2. DICTIONNAIRE DE COULEURS (marque/réf -> HEX) ---------- */
/* Correspondances approximatives des teintes populaires. La pipette photo complète le reste. */
const COLOR_DICT = {
  'victoria vynn 042':'#C86B7A', 'victoria vynn 218':'#F4C2C2', 'victoria vynn 002':'#F7E7E1',
  'dnd 450':'#B76E79', 'dnd 425':'#E8B4B8', 'dnd 587':'#7B1E3B',
  'opi bubble bath':'#F3D9DC', 'opi big apple red':'#B11226', 'opi mod about you':'#EFC3D3',
  'essie ballet slippers':'#EAD3D1', 'essie fiji':'#F1C6CE',
  'the gel bottle 001':'#F5DDE0', 'the gel bottle milkshake':'#F8E9E4',
  'semilac 056':'#C74375', 'semilac 003':'#F6D9D1',
  'kiara sky milk':'#FBEDE8', 'peggy sage nude':'#E6C6BE'
};
function guessHex(brand, ref){
  const norm = s => String(s||'').toLowerCase().replace(/#/g,'').replace(/\s+/g,' ').trim();
  const key = norm(brand+' '+ref);
  if(COLOR_DICT[key]) return COLOR_DICT[key];
  // Recherche partielle PRUDENTE : la marque doit correspondre ET la référence figurer
  // dans la clé (évite qu'un simple « red » ou « 002 » renvoie une teinte d'une autre marque).
  const b = norm(brand);
  for(const k in COLOR_DICT){
    const parts = k.split(' '); const kb = parts[0]; const kref = parts.slice(1).join(' ');
    if(b && kb && (b.includes(kb) || kb.includes(b)) && kref && key.includes(kref)) return COLOR_DICT[k];
  }
  return null;
}

/* ---------- 4. ANALYSE D'IMAGE (palette dominante) ---------- */
/* Réduit l'image sur un canvas et regroupe les couleurs par cases (quantification simple). */
function extractPalette(dataUrl, n=5){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const c = document.createElement('canvas');
        const w = c.width = 60, h = c.height = 60;
        const ctx = c.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const data = ctx.getImageData(0,0,w,h).data;
        const buckets = {};
        for(let i=0;i<data.length;i+=4){
          const a = data[i+3]; if(a<125) continue;
          // regroupe par pas de 32 pour créer des familles de couleurs
          const r = Math.round(data[i]/32)*32;
          const g = Math.round(data[i+1]/32)*32;
          const b = Math.round(data[i+2]/32)*32;
          const key = r+','+g+','+b;
          buckets[key] = (buckets[key]||0)+1;
        }
        const sorted = Object.entries(buckets).sort((a,b)=>b[1]-a[1]).slice(0,n);
        const hexes = sorted.map(([k])=>{
          const [r,g,b]=k.split(',').map(Number);
          return '#'+[r,g,b].map(x=>Math.min(255,x).toString(16).padStart(2,'0')).join('');
        });
        resolve(hexes.length?hexes:['#FF7EB9']);
      }catch(e){ resolve(['#FF7EB9']); }   // canvas « tainted » ou lecture impossible
    };
    img.onerror = ()=>resolve(['#FF7EB9']);
    img.src = dataUrl;
  });
}
// Distance couleur simple pour le color-matching
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function colorDist(a,b){ const A=hexToRgb(a),B=hexToRgb(b); return Math.sqrt((A[0]-B[0])**2+(A[1]-B[1])**2+(A[2]-B[2])**2); }
function closestGels(hex, k=2){
  return DB.gels.filter(g=>g.hex).map(g=>({g, d:colorDist(hex,g.hex)})).sort((a,b)=>a.d-b.d).slice(0,k).map(x=>x.g);
}
// Détection de style d'après la teinte moyenne
function detectStyle(palette){
  const avg = palette.map(hexToRgb).reduce((a,c)=>[a[0]+c[0],a[1]+c[1],a[2]+c[2]],[0,0,0]).map(x=>x/palette.length);
  const [r,g,b]=avg;
  const bright = (r+g+b)/3;
  if(bright>210) return 'Glazed / Clean Girl';
  if(r>150 && b>150 && g<130) return 'Y2K / Barbie';
  if(bright<90) return 'Marbre / Noir Chic';
  if(r>150 && g>120 && b<110) return 'French / Pêche';
  return 'Floral Pastel';
}

/* ---------- 5. DATES & PÉREMPTION ---------- */
function monthsSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr); if(isNaN(d)) return null;
  const now = new Date();
  const m = (now.getFullYear()-d.getFullYear())*12 + (now.getMonth()-d.getMonth());
  return Math.max(0, m);   // une date d'ouverture future ne donne pas de mois négatif
}
function peremptionInfo(gel){
  const m = monthsSince(gel.openDate);
  if(m===null) return { label:'Pas de date', cls:'text-gray-400', icon:'', months:null };
  if(m>=24) return { label:`Ouvert depuis ${m} mois 💔`, cls:'text-red-500 pulse-alert', icon:'💔', months:m };
  if(m>=12) return { label:`Ouvert depuis ${m} mois 🥺`, cls:'text-orange-500', icon:'🥺', months:m };
  return { label:`Ouvert depuis ${m} mois 💕`, cls:'text-green-500', icon:'💕', months:m };
}

// Un ongle posé au bout d'un doigt : bord libre (forme) EN HAUT, cuticule arrondie en bas
function nailShapeOnFinger(idx, cx, tipY, w, side){
  const p = DB.pose;
  const h = { 'Courte':14,'Moyenne':19,'Longue':25,'XL':31 }[p.longueur] || 19;
  const nw = Math.max(11, w*0.74);
  const bx = cx - nw/2, ex = cx + nw/2, mx = cx;
  const top = tipY + 3, bot = top + h;      // top = bord libre (bout du doigt), bot = cuticule
  const col = p.nails[idx] || '#FFDDE8';
  const cr = Math.min(5, nw/2 - 1);
  let topEdge;
  switch(p.forme){
    case 'Carré':              topEdge = `M${bx} ${top} L${ex} ${top}`; break;
    case 'Carré arrondi':      topEdge = `M${bx} ${top+3} Q${bx} ${top} ${bx+3} ${top} L${ex-3} ${top} Q${ex} ${top} ${ex} ${top+3}`; break;
    case 'Stiletto':           topEdge = `M${bx} ${(top+h*0.45).toFixed(1)} L${mx} ${(top-h*0.4).toFixed(1)} L${ex} ${(top+h*0.45).toFixed(1)}`; break;
    case 'Coffin / Ballerine': topEdge = `M${bx} ${top+2} L${bx+2} ${top} L${ex-2} ${top} L${ex} ${top+2}`; break;
    case 'Ovale':              topEdge = `M${bx} ${(top+h*0.32).toFixed(1)} Q${mx} ${(top-3).toFixed(1)} ${ex} ${(top+h*0.32).toFixed(1)}`; break;
    default: /* Amande */      topEdge = `M${bx} ${(top+h*0.42).toFixed(1)} Q${mx} ${(top-h*0.22).toFixed(1)} ${ex} ${(top+h*0.42).toFixed(1)}`;
  }
  const d = `${topEdge} L${ex} ${bot-cr} Q${ex} ${bot} ${ex-cr} ${bot} L${bx+cr} ${bot} Q${bx} ${bot} ${bx} ${bot-cr} Z`;
  let fx='';
  if(p.finish==='glossy') fx=`<path d="${d}" fill="url(#gloss${side})" style="mix-blend-mode:screen"/>`;
  else if(p.finish==='mat') fx=`<path d="${d}" fill="#000" opacity=".07"/>`;
  else if(p.finish==='glitter'){ let s=idx*9301+49297; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;}; let dd=''; for(let i=0;i<7;i++){ dd+=`<circle cx="${(bx+2+rnd()*(nw-4)).toFixed(1)}" cy="${(top+2+rnd()*(h-3)).toFixed(1)}" r="${(.6+rnd()*.9).toFixed(2)}" fill="#fff" opacity="${(.5+rnd()*.5).toFixed(2)}"/>`; } fx=dd; }
  return `<g onclick="pickNailColor(${idx})" style="cursor:pointer"><path d="${d}" fill="${col}" stroke="rgba(255,255,255,.7)" stroke-width="1"/>${fx}</g>`;
}

const NAIL_SEEDS = [ {cx:0.095,cy:0.66}, {cx:0.32,cy:0.15}, {cx:0.515,cy:0.11}, {cx:0.72,cy:0.145}, {cx:0.875,cy:0.285} ]; // pouce..auriculaire
const HAND = { img:null, base:null, red:[], w:0, h:0 };
function initHand(){
  if(!HAND_IMG || HAND_IMG.indexOf('data:image')!==0) return;   // pas de photo → illustration
  const img = new Image();
  img.onload = ()=>{
    try{
      const c = document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
      const ctx = c.getContext('2d'); ctx.drawImage(img,0,0);
      const id = ctx.getImageData(0,0,c.width,c.height); const d = id.data;
      const seeds = NAIL_SEEDS.map(s=>[s.cx*c.width, s.cy*c.height]);
      const maxD2 = Math.pow(0.17*c.height, 2);   // le rouge loin d'un ongle (plis de peau) est ignoré
      const red = [];
      for(let i=0;i<d.length;i+=4){
        const R=d[i],G=d[i+1],B=d[i+2],A=d[i+3];
        if(A>40 && R>150 && G<95 && B<100 && (R-G)>90 && (R-B)>78){   // rouge VIF d'ongle (exclut la peau)
          const p=i>>2, px=p%c.width, py=(p/c.width)|0;
          let best=0,bd=1e18; for(let k=0;k<5;k++){ const dx=px-seeds[k][0],dy=py-seeds[k][1],dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=k;} }
          if(bd<maxD2) red.push([i,best,(R+G+B)/765]);          // [index, n° ongle, luminosité]
        }
      }
      HAND.img=img; HAND.base=id; HAND.red=red; HAND.w=c.width; HAND.h=c.height;
      if(currentTab==='studio') renderTab();                    // re-rend avec la vraie main
    }catch(e){ HAND.img=null; }
  };
  img.onerror = ()=>{ HAND.img=null; };
  img.src = HAND_IMG;
}
// Recolore les ongles rouges de la photo avec les couleurs choisies (garde brillant/ombres)
function paintHand(canvas, side){
  const w=HAND.w, h=HAND.h; if(!w) return;
  canvas.width=w; canvas.height=h;
  const ctx = canvas.getContext('2d');
  const id = ctx.createImageData(w,h); id.data.set(HAND.base.data);
  const d = id.data;
  const cols = DB.pose.nails.map(c=>hexToRgb(c));
  const fin = DB.pose.finish, ref=0.5;
  const R=HAND.red;
  for(let k=0;k<R.length;k++){
    const i=R[k][0], C=cols[R[k][1]]||[255,120,180], v=R[k][2];
    let r,g,b;
    if(v<=ref){ const f=v/ref; r=C[0]*f; g=C[1]*f; b=C[2]*f; }
    else { let t=(v-ref)/(1-ref); if(fin==='mat') t*=0.4; r=C[0]+(255-C[0])*t; g=C[1]+(255-C[1])*t; b=C[2]+(255-C[2])*t; }
    d[i]=r; d[i+1]=g; d[i+2]=b;   // alpha inchangé
  }
  ctx.putImageData(id,0,0);
  if(fin==='glitter'){ ctx.fillStyle='rgba(255,255,255,.85)'; for(let k=0;k<R.length;k+=Math.max(1,(R.length/70)|0)){ const p=R[k][0]>>2; if(((k*2654435761)>>>0)%5===0){ ctx.beginPath(); ctx.arc(p%w,(p/w)|0,1.1,0,7); ctx.fill(); } } }
  if(side==='L'){   // main gauche = miroir
    const t=document.createElement('canvas'); t.width=w; t.height=h; t.getContext('2d').drawImage(canvas,0,0);
    ctx.clearRect(0,0,w,h); ctx.save(); ctx.translate(w,0); ctx.scale(-1,1); ctx.drawImage(t,0,0); ctx.restore();
  }
}
function paintAllHands(){ if(HAND.img) document.querySelectorAll('.hand-canvas').forEach(cv=> paintHand(cv, cv.dataset.side)); }
function handClick(e, side){
  const cv=e.currentTarget, r=cv.getBoundingClientRect();
  let x=(e.clientX-r.left)/r.width*HAND.w; const y=(e.clientY-r.top)/r.height*HAND.h;
  if(side==='L') x=HAND.w-x;
  let best=0,bd=1e18; for(let k=0;k<NAIL_SEEDS.length;k++){ const dx=x-NAIL_SEEDS[k].cx*HAND.w, dy=y-NAIL_SEEDS[k].cy*HAND.h, dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=k;} }
  pickNailColor(best);
}
// canvas (vraie main) si la photo est chargée, sinon l'illustration en secours
function handMarkup(side){
  if(!HAND.img) return handSVG(side);
  return `<canvas class="hand-canvas" data-side="${side}" onclick="handClick(event,'${side}')" style="width:100%;height:auto;max-height:340px;cursor:pointer;filter:drop-shadow(0 6px 10px var(--shadow-rose))"></canvas>`;
}

async function pipetteFromPhoto(e){
  const url = await readImage(e.target.files[0]).catch(()=>null); if(!url) return;
  const cv = document.getElementById('gf-canvas'); const hint = document.getElementById('gf-pip-hint');
  const img = new Image();
  img.onload = ()=>{
    const ratio = img.height/img.width; cv.width = 300; cv.height = 300*ratio;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cv.classList.remove('hidden'); hint.classList.remove('hidden');
  };
  img.src = url;
  cv.onclick = ev=>{
    const r = cv.getBoundingClientRect();
    const x = (ev.clientX-r.left)*(cv.width/r.width);
    const y = (ev.clientY-r.top)*(cv.height/r.height);
    const d = cv.getContext('2d').getImageData(x,y,1,1).data;
    const hex = '#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
    document.getElementById('gf-hex').value = hex;
    toast('🎨 Couleur prélevée : '+hex);
  };
}

    hex: document.getElementById('gf-hex').value,
    finish: document.getElementById('gf-finish').value,
    openDate: document.getElementById('gf-date').value

  if(id){ const i=DB.gels.findIndex(x=>x.id===id); const prev=DB.gels[i]; DB.gels[i]=gel; rollback=()=>{ DB.gels[i]=prev; }; }
  else { DB.gels.push(gel); rollback=()=>{ DB.gels.pop(); }; }

  closeModal(); pinkConfetti(); toast('💅 Gel enregistré !'); renderStock();

  const { data, style } = lastScan;
  DB.inspirations.unshift({ id:uid(), img:data.img||null, url:data.url||null, palette:data.palette, style, date:new Date().toISOString() });
  if(!save()){ DB.inspirations.shift(); return; }   // mémoire pleine → on annule
  toast('💾 Inspiration sauvée !'); renderSavedInspi();
}
function renderSavedInspi(){
  const box = document.getElementById('scan-saved'); if(!box) return;
  box.innerHTML = DB.inspirations.length ? DB.inspirations.map(i=>`
    <div class="card p-2 relative">
      <button onclick="delInspi('${i.id}')" class="absolute top-1 right-1 bg-white/80 rounded-full p-0.5 text-red-400 z-10"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
      ${i.img?`<img src="${i.img}" class="w-full h-24 object-cover rounded-xl mb-1">`:`<div class="w-full h-24 rounded-xl mb-1 flex gap-0.5 overflow-hidden">${i.palette.map(h=>`<div class="flex-1" style="background:${h}"></div>`).join('')}</div>`}

    </div>`).join('') : `<div class="col-span-full">${emptyState('🔮','Aucune inspi sauvée','Analyse ta première capture !')}</div>`;

function delInspi(id){ DB.inspirations=DB.inspirations.filter(x=>x.id!==id); save(); renderSavedInspi(); }

function renderCarnet(){
  const app = document.getElementById('app');
  // Prochain remplissage : à partir de la dernière pose (J+21)
  // On lit les dates en LOCAL (pas UTC) pour éviter un décalage d'un jour selon le fuseau.
  const parseLocal = s=>{ const [y,m,dd]=String(s||'').split('-').map(Number); return new Date(y||1970,(m||1)-1,dd||1); };
  let nextFill = '';
  if(DB.carnet.length){
    const last = [...DB.carnet].sort((a,b)=>parseLocal(b.date)-parseLocal(a.date))[0];
    const d = parseLocal(last.date); d.setDate(d.getDate()+21);
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.round((d-today)/86400000);
    nextFill = `<div class="card-heart-border bg-white/70 rounded-2xl p-3 mb-4 flex items-center gap-3">
      <span class="text-2xl">🗓️</span>
      <div class="text-sm">
        <b style="color:var(--accent-d)">Prochain remplissage estimé</b><br>
        <span style="color:var(--accent)">${d.toLocaleDateString('fr-FR')} · ${days>0?`dans ${days} jour(s) 💕`:'c\'est le moment ! 💅'}</span>
      </div></div>`;
  }
  app.innerHTML = `
    ${nextFill}
    <button onclick="carnetForm()" class="btn-primary w-full py-3 mb-4 flex items-center justify-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Nouvelle fiche souvenir</button>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      ${DB.carnet.length? [...DB.carnet].sort((a,b)=>parseLocal(b.date)-parseLocal(a.date)).map(carnetCard).join('') : `<div class="col-span-full">${emptyState('📔','Ton carnet est vide','Immortalise ta première pose 💖')}</div>`}
    </div>`;
  lucide.createIcons();
}
function carnetCard(c){
  return `<div class="polaroid">
    ${c.photo?`<img src="${c.photo}" class="w-full h-32 object-cover rounded-sm">`:`<div class="w-full h-32 rounded-sm flex items-center justify-center text-4xl" style="background:linear-gradient(135deg,#FFE3F1,#FFD1E8)">💅</div>`}
    <div class="absolute" style="top:6px;right:8px">💕</div>
    <div class="mt-1 px-0.5">
      <div class="font-script text-lg leading-tight" style="color:var(--accent-d)">${esc(c.title||'Ma pose')}</div>
      <div class="text-[10px] text-gray-500">${new Date(c.date).toLocaleDateString('fr-FR')}</div>
      <div class="text-[11px]">${'⭐'.repeat(Math.min(5,c.rating||0))}</div>
      ${c.wear?`<div class="text-[10px]" style="color:var(--accent)">Tenue : ${esc(c.wear)} sem.</div>`:''}

let carnetStars = 0;
function setStars(n){ carnetStars=n; document.querySelectorAll('#cf-stars button').forEach(b=> b.style.opacity = (+b.dataset.n<=n)?'1':'.3'); }
async function carnetPhoto(e){
  const raw = await readImage(e.target.files[0]).catch(()=>null);
  carnetPhotoTmp = raw ? await downscaleImage(raw, 1200, 0.75) : null;   // allège la photo avant stockage
  if(carnetPhotoTmp){ document.getElementById('cf-photo-lbl').innerHTML = `<img src="${carnetPhotoTmp}" class="w-full h-28 object-cover rounded-xl">`; }
}
function saveCarnet(){
  DB.carnet.push({
    id:uid(), photo:carnetPhotoTmp,
    title:document.getElementById('cf-title').value.trim(),
    date:document.getElementById('cf-date').value||new Date().toISOString().slice(0,10),
    products:document.getElementById('cf-products').value.trim(),
    rating:carnetStars, wear:document.getElementById('cf-wear').value,
    palette:[...DB.pose.nails]
  });
  if(!save()){ DB.carnet.pop(); return; }   // mémoire pleine → on annule (pas de faux « enregistré »)
  closeModal(); pinkConfetti(); heartBurst(); carnetStars=0; toast('📔 Souvenir enregistré !'); renderCarnet();
}
function delCarnet(id){ if(confirm('Supprimer cette fiche ?')){ DB.carnet=DB.carnet.filter(c=>c.id!==id); save(); renderCarnet(); } }

function downloadStory(){
  const node = document.getElementById('story-card');
  toast('🎀 Création de ta carte…');
  html2canvas(node, { backgroundColor:null, scale:3, useCORS:true }).then(canvas=>{
    const a = document.createElement('a');
    a.download = 'story-card-nailart.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    pinkConfetti(); toast('💖 Carte téléchargée !');
  }).catch(()=>toast('😢 Export impossible (photo externe ?)'));
}

let audioCtx = null;
function startTimer(sec, lowHeat=false){
  stopTimer();
  // On prépare le son ICI (déclenché par un vrai clic) pour éviter le blocage autoplay
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  timerTotal = timerLeft = sec;
  const heart = document.getElementById('timer-heart');
  heart.classList.add('heartbeat');
  updateTimerUI();
  if(lowHeat) toast('🌡️ Mode Low Heat : catalyse douce');
  timerInt = setInterval(()=>{
    timerLeft--; updateTimerUI();
    if(timerLeft<=0){ finishTimer(); }
  },1000);
}
function updateTimerUI(){
  const num = document.getElementById('timer-num'); if(num) num.textContent = timerLeft+'s';
  const heart = document.getElementById('timer-heart');
  if(heart){ const scale = 1 + (1 - timerLeft/timerTotal)*0.15; heart.style.transform=`scale(${scale})`; }
}
function stopTimer(){
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  const heart = document.getElementById('timer-heart'); if(heart){ heart.classList.remove('heartbeat'); heart.style.transform='scale(1)'; }
}
function finishTimer(){
  stopTimer();
  const num = document.getElementById('timer-num'); if(num) num.textContent='✓';
  playChime(); pinkConfetti(); heartBurst();
  toast('💖 Catalyse terminée, ma belle !');
}
// Signal sonore doux généré (pas de fichier externe)
function playChime(){
  try{
    const ctx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    [880,1108,1318].forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime+i*0.16;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25,t+0.03); g.gain.exponentialRampToValueAtTime(.001,t+0.5);
      o.start(t); o.stop(t+0.5);
    });
  }catch(e){}
}

let wakeLock = null, wakeLockWanted = false;   // wakeLockWanted = intention de l'utilisatrice
async function acquireWakeLock(){
  if(!('wakeLock' in navigator)) return false;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{        // libération auto (écran éteint, onglet caché)
      wakeLock = null;
      const l = document.getElementById('wakelock-label'); if(l) l.textContent = wakeLockWanted ? 'Actif ✨' : 'Veille';
    });
    return true;
  }catch(e){ return false; }
}
async function toggleWakeLock(){
  const label = document.getElementById('wakelock-label');
  if(wakeLockWanted){                                  // on éteint
    wakeLockWanted = false;
    try{ if(wakeLock) await wakeLock.release(); }catch(e){}
    wakeLock = null; label.textContent='Veille'; toast('😴 Écran libre'); return;
  }
  if(!('wakeLock' in navigator)) return toast('❌ Non supporté sur ce navigateur');
  wakeLockWanted = true;
  if(await acquireWakeLock()){ label.textContent='Actif ✨'; toast('☀️ Écran maintenu allumé pour ta séance !'); }
  else { wakeLockWanted = false; toast('❌ Impossible d\'activer'); }
}
// Réacquiert le verrou au retour de l'onglet si l'utilisatrice le veut toujours
document.addEventListener('visibilitychange', ()=>{
  if(wakeLockWanted && wakeLock===null && document.visibilityState==='visible'){ acquireWakeLock(); }
});

async function pushRemote(){
  if(!sb || !cloudUser){ setSync('warn'); return; }
  try{
    const { error } = await sb.from('nail_state')
      .upsert({ owner_id: cloudUser.id, data: DB }, { onConflict:'owner_id' });
    if(error) throw error;
    DB._syncedAt = DB._localTs;
    try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){}   // mémorise l'horodatage synchronisé
    setSync('ok');
  }catch(e){ setSync('warn'); }
}
async function pullRemote(){
  if(!sb || !cloudUser){ setSync('warn'); return; }
  try{
    const { data, error } = await sb.from('nail_state')
      .select('data,updated_at').eq('owner_id', cloudUser.id).maybeSingle();
    if(error) throw error;
    if(data && data.data && Object.keys(data.data).length){
      const remote = data.data;
      const remoteTs = remote._localTs || new Date(data.updated_at).getTime();
      const hasLocalUnsynced = (DB._localTs||0) > (DB._syncedAt||0);
      if(remoteTs > (DB._localTs||0)){
        if(hasLocalUnsynced){
          mergeRemoteIntoLocal(remote); // des modifs locales non envoyées → on FUSIONNE (rien n'est perdu)
          await pushRemote();
        } else {
          DB = Object.assign(structuredClone(defaultDB), remote); // rien de local en attente → on adopte le cloud
          save(true);
        }
      } else if((DB._localTs||0) > remoteTs){
        await pushRemote();           // le local est plus frais → on l'envoie
      }
    } else {
      await pushRemote();             // aucune ligne distante → on crée la première
    }
    setSync('ok');
  }catch(e){ setSync('warn'); }
}
// Fusionne le document distant dans le local sans rien perdre : union des collections par id.
function mergeRemoteIntoLocal(remote){
  const merged = Object.assign(structuredClone(defaultDB), remote);
  ['gels','decors','carnet','inspirations','promos'].forEach(k=>{
    const map = new Map();
    (remote[k]||[]).forEach(x=> x && x.id && map.set(x.id, x));
    (DB[k]||[]).forEach(x=> x && x.id && map.set(x.id, x)); // en cas de même id, la version locale gagne
    merged[k] = [...map.values()];
  });
  // Objets non-liste : on garde les valeurs LOCALES (elles sont en attente de synchro).
  ['tools','gelx','settings','pose'].forEach(k=>{ merged[k] = Object.assign({}, remote[k]||{}, DB[k]||{}); });
  merged._localTs = Date.now();
  DB = merged;
  save(true);
}

/* Peuple la couche décorative flottante (une seule fois) */
function renderDeco(){
  const d = document.getElementById('deco'); if(!d) return;
  const emo = ['🎀','💖','✨','🌸','💅','🤍','💫','🩰','🫧'];
  let html = '';
  for(let i=0;i<11;i++){
    const e = emo[Math.floor(Math.random()*emo.length)];
    const size = 18 + Math.random()*30;
    html += `<span style="left:${(Math.random()*92).toFixed(1)}vw; top:${(Math.random()*92).toFixed(1)}vh; font-size:${size.toFixed(0)}px; animation-delay:${(Math.random()*8).toFixed(1)}s; animation-duration:${(8+Math.random()*6).toFixed(1)}s">${e}</span>`;
  }
  d.innerHTML = html;
}

/* ================================================================
   DÉMARRAGE
   ================================================================ */
window.addEventListener('DOMContentLoaded', async ()=>{
  lucide.createIcons();
  renderDeco();                        // décor de fond
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }  // app installable + hors-ligne
  initHand();                          // charge la vraie main (photo) + repère les ongles
  switchTab('studio');                 // rend l'appli tout de suite (cache local)
  setSync('off');
  initCloud();
  if(sb){
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session){
        cloudUser = data.session.user;   // session déjà en mémoire (marche hors-ligne)
        await pullRemote();
        renderTab();
      } else {
        showLogin();                     // jamais connectée sur cet appareil
      }
      // Écoute les changements d'auth (rafraîchissement de jeton, déconnexion ailleurs…)
      sb.auth.onAuthStateChange((ev, session)=>{
        cloudUser = session ? session.user : null;
        if(ev === 'SIGNED_OUT'){ setSync('off'); showLogin(); }   // déconnectée (ici ou autre onglet)
      });
    }catch(e){ showLogin(); }
  } else {
    // Librairie cloud indisponible : l'appli reste utilisable en local seul.
    setSync('warn');
  }
  // petit mot de bienvenue au premier lancement local
  if(!DB.gels.length && !DB.carnet.length){
    setTimeout(()=>{ toast('🎀 Bienvenue dans ton atelier, ma belle !'); pinkConfetti(); }, 800);
  }
});
</script>
